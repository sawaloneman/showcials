name: Showcials v8 dependencies
on:
  push:
    paths:
      - '.github/workflows/dependencies-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependencies without lifecycle scripts
        run: |
          mkdir dependencies
          cd dependencies
          printf '{"private":true,"name":"showcials-pinned-dependencies","version":"8.0.0"}\n' > package.json
          npm install --ignore-scripts --no-fund --save-exact ws@8.21.1 brighterscript@0.73.3
          node node_modules/brighterscript/dist/cli.js --version
          npm ls --all > dependency-tree.txt
          node -e "if(require('ws/package.json').version!=='8.21.1')process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: showcials-dependencies-v8
          path: dependencies/
          retention-days: 7
          include-hidden-files: true
