name: Orbit voice and public acceptance
on:
  push:
    paths:
      - '.github/workflows/orbit-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed microphone compatibility correction
        run: |
          set -euo pipefail
          node tools/fix-voice-activation.js
          node tools/add-capture-fallback.js
          node --check web/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add real microphone compatibility capture when AudioWorklet cannot initialize'
            git push
          fi
      - name: Install media and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm install --ignore-scripts --no-audit --no-fund
          node build-media.js
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real local playback, chat, and synthetic microphone test
        env:
          PORT: '7801'
          HOST: '127.0.0.1'
          BASE_URL: 'http://127.0.0.1:7801'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          node server.js > test-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node -e "(async()=>{for(let i=0;i<50;i++){try{if((await fetch(process.env.BASE_URL+'/api/health')).ok)return}catch{}await new Promise(r=>setTimeout(r,200))}process.exit(1)})()"
          node tests/protocol.js 2>&1 | tee test-results/protocol.log
          python tests/browser.py 2>&1 | tee test-results/browser.log
          cp orbit-room.png test-results/local-room.png
      - name: Real public HTTPS playback, chat, and synthetic microphone test
        env:
          BASE_URL: 'https://showcials-orbit-production.up.railway.app'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          node -e "(async()=>{for(let i=0;i<150;i++){try{let r=await fetch(process.env.BASE_URL+'/app.js?voice-acceptance=2');if(r.ok&&(await r.text()).includes('ORBIT_CAPTURE_FALLBACK_V1'))return}catch{}await new Promise(r=>setTimeout(r,2000))}process.exit(1)})()"
          python tests/browser.py 2>&1 | tee test-results/hosted-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-voice-evidence
          path: |
            orbit-*.png
            test-results/
            tests/
            web/
            lib/
            package.json
            package-lock.json
            server.js
            build-media.js
            Dockerfile
          retention-days: 7
